name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Build and test the package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app:
    name: Build the app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: >
          xcodebuild build
          -project App/Gyro.xcodeproj
          -scheme Gyro
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
