name: Hardware report
description: Tell us how gyro behaves on your Mac, working or not.
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        gyro has only been tested on an M5 Pro MacBook Pro, so every report from another
        model helps. Reports that everything works are just as useful as bug reports.
  - type: input
    id: model
    attributes:
      label: Mac
      description: The model and chip, e.g. "MacBook Air 13-inch, M3".
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: The output of `sw_vers -productVersion`.
    validations:
      required: true
  - type: textarea
    id: sensors
    attributes:
      label: Output of `gyro sensors`
      render: text
    validations:
      required: true
  - type: dropdown
    id: imu
    attributes:
      label: Does `sudo gyro` show live acceleration and rotation?
      options:
        - "Yes"
        - "No"
        - Partly
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Odd readings, errors, how well the gestures recognize out of the box.
